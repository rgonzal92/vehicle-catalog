# The worker: the same build as the API, run to do the jobs that changes leave behind. The API
# migrates the database and keeps its sessions; the worker does neither.
spring.flyway.enabled=false
spring.session.jdbc.cleanup-cron=-

# Where the queue of the jobs is. Only the worker is told, and it does not start without it.
app.jobs.queue-url=${JOBS_QUEUE_URL}

# Waiting on the queue takes a thread for as long as it waits, and sending takes another.
spring.task.scheduling.pool.size=2
