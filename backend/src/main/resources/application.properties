spring.application.name=vehicle-catalog
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
# Health is served at /api/health, so one route prefix reaches everything the backend answers.
management.endpoints.web.base-path=/api
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false

# The address visitors use. Every address sent to a browser is built from it, never from the
# request's Host header, because the proxy in front of the backend does not forward that header.
app.public-url=${PUBLIC_URL}
# The login provider's logout address. Sign-out passes through it on the way back to the landing
# page.
app.logout-url=${LOGOUT_URL}

# The provider's endpoints come from the environment: its issuer address when deployed, or its
# authorization, token, and key addresses for the local login server.
spring.security.oauth2.client.registration.cognito.client-id=${OIDC_CLIENT_ID}
spring.security.oauth2.client.registration.cognito.client-secret=${OIDC_CLIENT_SECRET}
spring.security.oauth2.client.registration.cognito.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.cognito.scope=openid,email,profile
spring.security.oauth2.client.registration.cognito.redirect-uri={baseUrl}/api/login/oauth2/code/{registrationId}

# Sessions live in PostgreSQL, in tables created by a migration.
spring.session.jdbc.initialize-schema=never
spring.session.timeout=2h
server.servlet.session.cookie.name=__Host-SESSION
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
