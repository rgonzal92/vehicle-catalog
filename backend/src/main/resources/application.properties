spring.application.name=vehicle-catalog
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
# Health is served at /api/health, so one route prefix reaches everything the backend answers.
management.endpoints.web.base-path=/api
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
# Health says how each part is, the database among them, and nothing more of a part than that.
management.endpoint.health.show-components=always
# Ready means that startup has finished and that the database answers.
management.endpoint.health.group.readiness.include=readinessState,db

# The backend's metrics and traces go to an agent that sends them on. Where that agent is, the
# stack says, and has the backend send its metrics; told of no agent, the backend keeps both to
# itself, as it does when run by hand and in tests.
management.otlp.metrics.export.enabled=false
# A metric is sent as what happened since it was last sent. Whatever is timed is sent as counts in
# buckets that each reach a fixed share further than the one before, and in few enough of them for
# Amazon CloudWatch to take at once: the agent drops a time that comes without buckets. No largest
# time is sent beside them: it would be a metric more.
management.otlp.metrics.export.aggregation-temporality=delta
management.otlp.metrics.export.histogram-flavor=base2-exponential-bucket-histogram
management.otlp.metrics.export.max-bucket-count=100
management.otlp.metrics.export.publish-max-gauge-for-histograms=false
management.metrics.distribution.percentiles-histogram.all=true
# Every request is traced: the site has few of them.
management.tracing.sampling.probability=1.0
# A trace has one span for a request, and none for each step of checking who sent it.
management.observations.enable.spring.security=false

# The address visitors use. Every address sent to a browser is built from it, never from the
# request's Host header, because the proxy in front of the backend does not forward that header.
app.public-url=${PUBLIC_URL}
# The login provider's logout address. Sign-out passes through it on the way back to the landing
# page.
app.logout-url=${LOGOUT_URL}

# The provider's endpoints come from the environment: its issuer address when deployed, or its
# authorization, token, and key addresses for the local login server.
spring.security.oauth2.client.registration.cognito.client-id=${OIDC_CLIENT_ID}
spring.security.oauth2.client.registration.cognito.client-secret=${OIDC_CLIENT_SECRET}
spring.security.oauth2.client.registration.cognito.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.cognito.scope=openid,email,profile
spring.security.oauth2.client.registration.cognito.redirect-uri={baseUrl}/api/login/oauth2/code/{registrationId}

# The Amazon Cognito user pool whose accounts an admin lists and whose roles an admin changes. Left
# empty, the configured sandbox accounts stand in for the pool, which is how the app runs locally
# and in tests.
app.cognito.user-pool-id=${COGNITO_USER_POOL_ID:}

# Sessions live in PostgreSQL, in tables created by a migration.
spring.session.jdbc.initialize-schema=never
spring.session.timeout=2h
server.servlet.session.cookie.name=__Host-SESSION
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Where the spreadsheets that people export are kept: a bucket, and for a stand-in for Amazon S3
# the address it is reached at. Without a bucket nothing can be exported.
app.exports.bucket=${EXPORTS_BUCKET:}
app.exports.endpoint=${EXPORTS_ENDPOINT:}

# Where the documents that admins upload are kept, in the same way. Without a bucket none can be
# uploaded. A file of a little over what a document may be is taken in, so that it is refused with
# the reason; a larger one is cut off before it has arrived.
app.documents.bucket=${DOCUMENTS_BUCKET:}
app.documents.endpoint=${DOCUMENTS_ENDPOINT:}
spring.servlet.multipart.max-file-size=3MB

# How alike a passage's meaning has to be to what is searched for to be found, from 0 for
# unrelated to 1 for the same. Below it a passage is not returned, so a question the documents
# have nothing on finds nothing. It lies between what docs/ai-evaluation.md measured with the
# real embedding model: 0.25 at the most for a question the notes do not answer, and 0.36 at the
# least for one they do.
app.documents.least-likeness=0.3
spring.servlet.multipart.max-request-size=4MB

# When the demo reset runs, as a Spring cron expression read in UTC: every day at 03:00. A dash
# turns it off, for a database whose contents are to be kept.
app.demo-reset.cron=0 0 3 * * *

# The model years a catalog can be made for.
app.model-years=2024,2025,2026,2027,2028

# A request does not hold a database session open while its response is written.
spring.jpa.open-in-view=false

# The language model the app asks, and how long it is waited for. Without a key the app starts and
# runs, and the model cannot be asked.
app.ai.api-key=${OPENAI_API_KEY:}
app.ai.base-url=https://api.openai.com/v1
app.ai.model=gpt-6-luna
app.ai.timeout=20s

# What asking the model may cost in a UTC calendar day, in US dollars: for the whole app, whoever
# asks, and for one account. A request reserves the most it can cost before it is sent, at the
# model's prices for a million tokens, as OpenAI lists them for gpt-6-luna on 2026-10-09.
app.ai.allowance.daily=1.00
app.ai.allowance.daily-per-account=0.25
app.ai.price.input-per-million=0.10
app.ai.price.output-per-million=0.50

# The model that turns a text into the numbers that stand for what it means, and what a million
# tokens sent to it cost, as OpenAI lists it on 2026-10-10. It gives 1,536 numbers for a text,
# which is the size the passages' table keeps: another model means processing every document
# again.
app.ai.embedding-model=text-embedding-3-small
app.ai.price.embedding-per-million=0.02
