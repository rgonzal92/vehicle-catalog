# What runs on the host: Caddy, which the distribution reaches; the backend, which Caddy passes the
# API's requests to; the worker, which does the jobs the backend leaves it; and the database and
# the cache, which nothing outside this stack reaches. The secrets come
# from a file beside this one that only root can read, written from Parameter Store whenever the
# stack is started. What the backend is told about signing in comes from settings.env, which
# Terraform writes from what it knows of the login provider. What the backend reports of itself
# goes to Amazon CloudWatch: its log straight from Docker, its metrics and traces by way of the
# CloudWatch agent, which runs on the host itself and not in this stack.
services:
  caddy:
    image: caddy:2.11.6-alpine
    restart: unless-stopped
    environment:
      ORIGIN_NAME: origin-catalog.rgonz.dev
      ORIGIN_SECRET: ${ORIGIN_SECRET:?The secret the distribution sends is not set}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificate and the account with the certificate authority, kept across restarts.
      - caddy-data:/data

  backend:
    # The image released last. release.sh gives it this name, and it is never fetched under it.
    image: vehicle-catalog-backend:current
    pull_policy: never
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Where the login provider is, and who the demo accounts are to it.
    env_file:
      - settings.env
    environment:
      # The heap may grow to this and no further, which is twice the most it has held here. Left
      # to itself, Java would let it have a quarter of the host's memory.
      JAVA_TOOL_OPTIONS: -XX:MaxHeapSize=256m
      DATABASE_URL: jdbc:postgresql://db:5432/catalog
      DATABASE_USER: catalog
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?The database password is not set}
      PUBLIC_URL: https://catalog.rgonz.dev
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?The secret the backend shows the login provider is not set}
      # The key for the language model, which there may be none of: the app then says so.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Where the cache is, and the password it asks for.
      CACHE_HOST: cache
      CACHE_PASSWORD: ${CACHE_PASSWORD:?The cache's password is not set}
      # The log is written as JSON, one object to a line, with the trace id a line belongs to.
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      # Where the agent listens: for metrics on one port of the host, for traces on another.
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "true"
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://host.docker.internal:4318/v1/metrics
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://host.docker.internal:4328/v1/traces
    # The host, by a name of its own, since the agent is not in this stack.
    extra_hosts:
      - host.docker.internal:host-gateway
    # Docker sends the log to CloudWatch Logs as the host's role, and keeps a copy for `docker
    # logs`. The backend is never held up by it: it starts whether or not CloudWatch can be
    # reached, and what cannot be sent in time is dropped.
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: /vehicle-catalog/backend
        awslogs-stream: backend
        mode: non-blocking
    # Healthy means startup has finished and the database answers. A release is given four minutes
    # to get there, on a host that may be short of CPU time, before it counts as one that failed.
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:8080/api/health/readiness
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 4m

  # The backend's image once more, run as the worker: it sends the messages of the jobs the API
  # wrote and does the jobs whose messages arrive. It starts once the API has migrated the
  # database, and nothing outside this stack reaches it.
  worker:
    image: vehicle-catalog-backend:current
    pull_policy: never
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # The same settings as the API's, of which the worker uses where the queue is.
    env_file:
      - settings.env
    environment:
      SPRING_PROFILES_ACTIVE: worker
      # The heap may grow to this and no further. Left to itself, Java would let each of the two
      # processes have a quarter of the host's memory.
      JAVA_TOOL_OPTIONS: -XX:MaxHeapSize=192m
      DATABASE_URL: jdbc:postgresql://db:5432/catalog
      DATABASE_USER: catalog
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?The database password is not set}
      PUBLIC_URL: https://catalog.rgonz.dev
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?The secret the backend shows the login provider is not set}
      # The key for the language model, which there may be none of: the app then says so.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Where the cache is, and the password it asks for.
      CACHE_HOST: cache
      CACHE_PASSWORD: ${CACHE_PASSWORD:?The cache's password is not set}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      # Its traces go to the agent, as the API's do, and so does its one metric: how long each job
      # took.
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "true"
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://host.docker.internal:4318/v1/metrics
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://host.docker.internal:4328/v1/traces
    extra_hosts:
      - host.docker.internal:host-gateway
    # Its log goes where the API's goes, under a name of its own.
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: /vehicle-catalog/backend
        awslogs-stream: worker
        mode: non-blocking
    # Healthy means startup has finished and the database answers, as for the API.
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:8080/api/health/readiness
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 4m

  db:
    # PostgreSQL 18.6 as its own image has it, on the same release of Debian, with pgvector added.
    # The image without "trixie" in its name is built on an older Debian, whose C library sorts
    # text another way than the one this database's indexes were built with.
    image: pgvector/pgvector:0.8.7-pg18-trixie
    restart: unless-stopped
    user: postgres
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?The database password is not set}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 12

  # Redis, which keeps values in memory by a key: what can be read from the database again, and
  # is read sooner from here. It may hold 64 MB of them, and past that drops the ones used longest
  # ago. It keeps nothing on disk, asks for a password, and listens on no port of the host. The API
  # and the worker do not wait for it: they run whether it does or not.
  cache:
    image: redis:8.10.2-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
      - --requirepass
      - ${CACHE_PASSWORD:?The cache's password is not set}
    # The image names a volume for what Redis would keep. It is given memory in its place, into
    # which nothing is written.
    tmpfs:
      - /data

volumes:
  caddy-data:
  postgres-data:
