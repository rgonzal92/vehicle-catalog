# Laid over ../compose.yaml to try the host's stack on one machine: a stand-in for the certificate
# authority, a registry to release images from, stand-ins for the CloudWatch agent and for the
# queue of the jobs, a name that only this network knows, and ports of its own.
services:
  # Stands in for Let's Encrypt. It comes to port 80 of the name to check, as Let's Encrypt does.
  authority:
    image: ghcr.io/letsencrypt/pebble:2.10.1
    environment:
      # Checks at once, where it would otherwise wait a while first.
      PEBBLE_VA_NOSLEEP: "1"
    volumes:
      - ./test/authority.json:/test/config/pebble-config.json:ro
    networks:
      default:
        # The one name its own certificate is made out to.
        aliases:
          - pebble

  # Holds the images that are released, as the registry in AWS does for the host.
  registry:
    image: registry:3.1.2
    ports:
      - "127.0.0.1:15000:5000"

  # Stands in for the CloudWatch agent: it takes the metrics and traces the backend sends, and
  # writes down each one it is sent.
  agent:
    image: otel/opentelemetry-collector:0.162.0
    volumes:
      - ./test/agent.yaml:/etc/otelcol/config.yaml:ro

  # Stands in for the queues of the jobs in AWS: the queue itself and its dead-letter queue.
  queue:
    image: softwaremill/elasticmq-native:1.7.1
    configs:
      - source: queue
        target: /opt/elasticmq.conf

  caddy:
    depends_on:
      - authority
    environment:
      ORIGIN_NAME: origin.test
      ACME_DIRECTORY: https://pebble:14000/dir
      # The stand-in signs its own address with a certificate of its own making.
      SSL_CERT_FILE: /authority-root.pem
    volumes:
      - ${AUTHORITY_ROOT:?Run check.sh, which sets this}:/authority-root.pem:ro
    networks:
      default:
        aliases:
          - origin.test
    ports: !override
      - "127.0.0.1:18080:80"
      - "127.0.0.1:18443:443"

  backend:
    environment:
      # The stand-in is in this stack, takes both on one port, and is sent metrics every few
      # seconds, where the agent is sent them every minute.
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://agent:4318/v1/metrics
      MANAGEMENT_OTLP_METRICS_EXPORT_STEP: 5s
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://agent:4318/v1/traces
    # The log stays on this machine.
    logging: !reset null
    # An image that never gets ready is known for one sooner than on the host.
    healthcheck:
      start_period: 1m

  worker:
    environment:
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://agent:4318/v1/traces
    logging: !reset null
    healthcheck:
      start_period: 1m

configs:
  queue:
    content: |
      include classpath("application.conf")

      queues {
        jobs {
          defaultVisibilityTimeout = 120 seconds
          deadLettersQueue {
            name = "jobs-failed"
            maxReceiveCount = 3
          }
        }
        jobs-failed {}
      }
