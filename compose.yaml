name: vehicle-catalog

# Local development stack. The frontend dev server proxies /api to the backend's published port.
services:
  db:
    image: postgres:18.6
    user: postgres
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: >-
        ${CATALOG_DB_PASSWORD:?Set CATALOG_DB_PASSWORD in a local .env file}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/catalog
      DATABASE_USER: catalog
      DATABASE_PASSWORD: >-
        ${CATALOG_DB_PASSWORD:?Set CATALOG_DB_PASSWORD in a local .env file}
    ports:
      - "127.0.0.1:8090:8080"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:8080/api/health
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
