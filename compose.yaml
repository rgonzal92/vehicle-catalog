name: vehicle-catalog

# Local development stack. The frontend dev server at http://localhost:4200 proxies /api to the
# backend's published port, the login server stands in for Amazon Cognito, the queue for Amazon SQS,
# and the storage for Amazon S3.
services:
  db:
    image: postgres:18.6
    user: postgres
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: >-
        ${CATALOG_DB_PASSWORD:?Set CATALOG_DB_PASSWORD in a local .env file}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 12

  # Asks for a username only. "author", "manager", and "admin" sign in as the demo accounts,
  # "visitor" as a sandbox account that is not one of them, and "norole" as a person without a
  # role, as does any other name.
  login:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.5
    environment:
      JSON_CONFIG: |
        {
          "interactiveLogin": true,
          "tokenCallbacks": [
            {
              "issuerId": "default",
              "requestMappings": [
                {
                  "requestParam": "subject",
                  "match": "author",
                  "claims": {
                    "cognito:username": "author",
                    "email": "author@example.test",
                    "name": "Demo Author",
                    "cognito:groups": ["author"]
                  }
                },
                {
                  "requestParam": "subject",
                  "match": "manager",
                  "claims": {
                    "cognito:username": "manager",
                    "email": "manager@example.test",
                    "name": "Demo Manager",
                    "cognito:groups": ["manager"]
                  }
                },
                {
                  "requestParam": "subject",
                  "match": "admin",
                  "claims": {
                    "cognito:username": "admin",
                    "email": "admin@example.test",
                    "name": "Demo Admin",
                    "cognito:groups": ["admin"]
                  }
                },
                {
                  "requestParam": "subject",
                  "match": "visitor",
                  "claims": {
                    "cognito:username": "visitor",
                    "email": "visitor@example.test",
                    "name": "Sandbox Visitor",
                    "cognito:groups": ["author"]
                  }
                },
                {
                  "requestParam": "subject",
                  "match": "norole",
                  "claims": {
                    "cognito:username": "norole",
                    "email": "norole@example.test",
                    "name": "No Role"
                  }
                }
              ]
            }
          ]
        }
    ports:
      - "127.0.0.1:8091:8080"

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment: &backend-settings
      DATABASE_URL: jdbc:postgresql://db:5432/catalog
      DATABASE_USER: catalog
      DATABASE_PASSWORD: >-
        ${CATALOG_DB_PASSWORD:?Set CATALOG_DB_PASSWORD in a local .env file}
      PUBLIC_URL: http://localhost:4200
      # The login server returns to the address in its own parameter and ignores the two that
      # Amazon Cognito needs, which the backend adds.
      LOGOUT_URL: http://localhost:8091/default/endsession?post_logout_redirect_uri=http://localhost:4200/
      OIDC_CLIENT_ID: vehicle-catalog
      # The local login server accepts any client secret.
      OIDC_CLIENT_SECRET: not-a-secret
      # The browser reaches the login server on the published port; the backend reaches it by its
      # service name.
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_COGNITO_AUTHORIZATION_URI: http://localhost:8091/default/authorize
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_COGNITO_TOKEN_URI: http://login:8080/default/token
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_COGNITO_JWK_SET_URI: http://login:8080/default/jwks
      # The demo accounts as the login server above knows them. Its subject for an account is the
      # username typed at sign-in. Seeded catalogs belong to the author and the manager.
      APP_DEMOACCOUNTS_0_ROLE: author
      APP_DEMOACCOUNTS_0_USERNAME: author
      APP_DEMOACCOUNTS_0_SUBJECT: author
      APP_DEMOACCOUNTS_0_DISPLAYNAME: Demo Author
      APP_DEMOACCOUNTS_1_ROLE: manager
      APP_DEMOACCOUNTS_1_USERNAME: manager
      APP_DEMOACCOUNTS_1_SUBJECT: manager
      APP_DEMOACCOUNTS_1_DISPLAYNAME: Demo Manager
      APP_DEMOACCOUNTS_2_ROLE: admin
      APP_DEMOACCOUNTS_2_USERNAME: admin
      APP_DEMOACCOUNTS_2_SUBJECT: admin
      # Sandbox accounts are the ones an admin of the public demo may see and manage. The demo
      # accounts are sandbox accounts whose roles no one can change. This one's role can be
      # changed, which is what shows role management without touching anyone real. The change
      # shows in the list and signs the account out, but the login server above knows nothing of
      # it and signs "visitor" in as an author every time.
      APP_SANDBOXACCOUNTS_0_SUBJECT: visitor
      APP_SANDBOXACCOUNTS_0_USERNAME: visitor
      APP_SANDBOXACCOUNTS_0_EMAIL: visitor@example.test
      APP_SANDBOXACCOUNTS_0_ROLE: author
      # The demo reset puts the library and the catalogs back as a first start leaves them, every
      # day at 03:00 UTC, here as on the public demo. Set DEMO_RESET_CRON=- to keep what is done
      # here.
      APP_DEMORESET_CRON: ${DEMO_RESET_CRON:-0 0 3 * * *}
      # Set LARGEST_CATALOG=true to start with the largest catalog there can be as well, 500 feature
      # rows by 96 offerings, to see and measure the app at that size.
      APP_LARGESTCATALOG: ${LARGEST_CATALOG:-false}
      # Where exported spreadsheets are kept. The API hands out links to them, which a browser
      # follows from outside this stack.
      EXPORTS_BUCKET: exports
      EXPORTS_ENDPOINT: http://localhost:8094
    ports:
      - "127.0.0.1:8090:8080"
    # Ready means startup has finished, which includes filling an empty library.
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:8080/api/health/readiness
      interval: 5s
      timeout: 3s
      retries: 12

  # The worker: the backend's own build, run to do the jobs that changes leave behind. It starts
  # once the API has migrated the database, and nothing reaches it from outside this stack.
  worker:
    build: ./backend
    depends_on:
      backend:
        condition: service_healthy
      queue:
        condition: service_started
      storage:
        condition: service_started
    environment:
      <<: *backend-settings
      SPRING_PROFILES_ACTIVE: worker
      JOBS_QUEUE_URL: http://queue:9324/queue/jobs
      # The worker puts the exported spreadsheets where this stack keeps them.
      EXPORTS_ENDPOINT: http://storage:9090
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:8080/api/health/readiness
      interval: 5s
      timeout: 3s
      retries: 12

  # Stands in for Amazon S3 and keeps the one bucket of exported spreadsheets. The worker writes a
  # file there, and a browser reads it through a link the API hands out, so it is published.
  storage:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: exports
    ports:
      - "127.0.0.1:8094:9090"

  # Stands in for Amazon SQS, whose protocol it speaks. It keeps the queue the jobs' messages travel
  # on and the dead-letter queue beside it, as AWS does: a message that a worker has received is
  # hidden for two minutes, and one that was delivered three times and never deleted is moved to
  # the dead-letter queue. Only the worker talks to it.
  queue:
    image: softwaremill/elasticmq-native:1.7.1
    configs:
      - source: queue
        target: /opt/elasticmq.conf

configs:
  queue:
    content: |
      include classpath("application.conf")

      queues {
        jobs {
          defaultVisibilityTimeout = 120 seconds
          deadLettersQueue {
            name = "jobs-failed"
            maxReceiveCount = 3
          }
        }
        jobs-failed {}
      }

volumes:
  postgres_data:
