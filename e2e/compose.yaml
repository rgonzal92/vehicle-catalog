# Laid over the root compose.yaml for the browser tests. It adds the web server that puts the
# frontend and the API on one origin, and moves the published ports so this stack can run beside
# the development one. Paths are relative to the root compose.yaml.
services:
  web:
    image: caddy:2.11.6-alpine
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./e2e/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist/vehicle-catalog/browser:/srv:ro
    ports:
      - "127.0.0.1:8092:8080"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:8080/
      interval: 2s
      timeout: 3s
      retries: 15

  login:
    ports: !override
      - "127.0.0.1:8093:8080"

  storage:
    ports: !override
      - "127.0.0.1:8095:9090"

  backend:
    ports: !reset []
    environment:
      EXPORTS_ENDPOINT: http://localhost:8095
      # No demo reset while the browser tests run: one at 03:00 UTC would take their work away.
      APP_DEMORESET_CRON: "-"
      PUBLIC_URL: http://localhost:8092
      # The web server stands in for OpenAI, so the app has a key that is none and asks it there.
      OPENAI_API_KEY: a-key-for-the-browser-tests
      APP_AI_BASE_URL: http://web:8090/v1
      LOGOUT_URL: http://localhost:8093/default/endsession?post_logout_redirect_uri=http://localhost:8092/
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_COGNITO_AUTHORIZATION_URI: http://localhost:8093/default/authorize

  worker:
    environment:
      # The worker asks the model too, for the summaries of submitted catalogs.
      OPENAI_API_KEY: a-key-for-the-browser-tests
      APP_AI_BASE_URL: http://web:8090/v1
