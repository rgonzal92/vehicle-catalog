name: Verify

# Each push starts one run: on its pull request, or on main.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request cancels the run it supersedes. A run on main is in a group of its
# own, so it is never cancelled and never waits for another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# Three of these checks use container images, most of them from Docker Hub. Each keeps the images
# it uses from one run to the next, in the pipeline's cache, and pulls only what is not there: a
# run does not wait on Docker Hub then. NAMED_IN lists the files that name a check's images, and
# .github/scripts/kept-images.sh has the rest.
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NAMED_IN: backend/src/test/java/dev/rgonz/catalog/ApplicationIT.java
      # Testcontainers would start a container of its own to clear up after the tests, from an
      # image that no file here names. This machine is thrown away after the run, so nothing
      # needs clearing up.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          # The newest Java 25: setup-java takes Corretto by major version only.
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Name the images this check uses
        id: images
        run: ${{ github.workspace }}/.github/scripts/kept-images.sh named >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: kept
        with:
          path: ${{ runner.temp }}/kept-images/images
          key: images-backend-${{ steps.images.outputs.key }}
          restore-keys: images-backend-
      - name: Load the images that were kept
        run: ${{ github.workspace }}/.github/scripts/kept-images.sh load
      - name: Verify
        run: ./mvnw -B verify
      - name: Gather the images to keep
        run: ${{ github.workspace }}/.github/scripts/kept-images.sh keep
        env:
          RESTORED_AS_NAMED: ${{ steps.kept.outputs.cache-hit }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run format:check && npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          # Empty on pull requests from forks and from Dependabot; the build passes without it.
          PRIMEUI_LICENSE_KEY: ${{ secrets.PRIMEUI_LICENSE_KEY }}

  # The browser tests, in two halves that run at the same time, each on a machine of its own with
  # a stack and a database of its own. One machine does not get through them sooner with more
  # workers: its processors are shared with the stack, and the browsers go short.
  browser-tests:
    name: browser tests, half ${{ matrix.half }} of 2
    runs-on: ubuntu-latest
    strategy:
      # A half that fails does not stop the other, whose report is wanted all the same.
      fail-fast: false
      matrix:
        half: [1, 2]
    defaults:
      run:
        working-directory: e2e
    env:
      NAMED_IN: compose.yaml e2e/compose.yaml backend/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Name the images this check uses
        id: images
        run: ${{ github.workspace }}/.github/scripts/kept-images.sh named >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: kept
        with:
          path: ${{ runner.temp }}/kept-images/images
          key: images-browser-tests-${{ steps.images.outputs.key }}
          restore-keys: images-browser-tests-
      - name: Load the images that were kept
        run: ${{ github.workspace }}/.github/scripts/kept-images.sh load
      - name: Install
        run: npm ci --prefix ../frontend && npm ci
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: Lint
        run: npm run format:check && npm run lint && npm run typecheck
      - name: Browser tests
        # The database lives only for this run, so its password is made up on the spot.
        run: CATALOG_DB_PASSWORD="$(openssl rand -hex 16)" npm run e2e
        env:
          # Which part of the suite this machine runs, as Playwright counts them.
          SHARD: ${{ matrix.half }}/2
          # Empty on pull requests from forks and from Dependabot; the build passes without it.
          PRIMEUI_LICENSE_KEY: ${{ secrets.PRIMEUI_LICENSE_KEY }}
      - name: Gather the images to keep
        run: ${{ github.workspace }}/.github/scripts/kept-images.sh keep
        env:
          RESTORED_AS_NAMED: ${{ steps.kept.outputs.cache-hit }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-half-${{ matrix.half }}
          path: e2e/playwright-report
          retention-days: 7

  # What a merge and a deploy wait for: both halves of the browser tests. It runs whatever became
  # of them, because a check that is skipped counts as one that passed.
  e2e:
    needs: browser-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Both halves passed
        run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.browser-tests.result }}

  # What the host answers, tried on this machine against a stand-in for the certificate authority.
  host:
    runs-on: ubuntu-latest
    env:
      NAMED_IN: deploy/compose.yaml deploy/test/compose.yaml backend/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Name the images this check uses
        id: images
        run: ${{ github.workspace }}/.github/scripts/kept-images.sh named >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: kept
        with:
          path: ${{ runner.temp }}/kept-images/images
          key: images-host-${{ steps.images.outputs.key }}
          restore-keys: images-host-
      - name: Load the images that were kept
        run: ${{ github.workspace }}/.github/scripts/kept-images.sh load
      - name: Check the host's stack
        run: deploy/test/check.sh
      - name: Gather the images to keep
        run: ${{ github.workspace }}/.github/scripts/kept-images.sh keep
        env:
          RESTORED_AS_NAMED: ${{ steps.kept.outputs.cache-hit }}

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.9'
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -check -recursive
      - name: Validate
        # Without the backend, so that this needs no access to AWS.
        run: terraform init -backend=false -input=false && terraform validate
      - name: Test
        run: terraform test
      - name: Check the host's script
        # What Terraform fills in is written the way bash writes a variable, so the script parses
        # as bash before it is filled in.
        run: bash -n templates/host_stack.sh.tftpl
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Test the CloudFront function
        run: node --test functions/app_routes.test.mjs
