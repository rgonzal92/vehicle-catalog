name: Plan

# Every pull request from a branch of this repository shows what Terraform would change in AWS.
on:
  pull_request:

# A newer push to a pull request cancels the plan it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  plan:
    # A pull request from a fork gets no access to AWS. Neither does one from Dependabot, which
    # GitHub runs without the repository's secrets, as it does one from a fork.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To ask GitHub for the token that AWS exchanges for the plan role's credentials.
      id-token: write
      # To write the plan on the pull request.
      pull-requests: write
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after this reaches the repository through Git, so its token is not kept.
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.9'
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          # A role that reads and does nothing else, and that only a pull request of this
          # repository can take on. Its name carries the AWS account's number, so it is a secret,
          # which GitHub keeps out of a run's log, and the number is kept out of the log as well.
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - name: Plan
        # Without the lock: the role cannot write the lock file, and a plan changes nothing.
        run: |
          terraform init -input=false
          terraform plan -input=false -lock=false -out=plan.tfplan
        env:
          TF_VAR_budget_notification_email: ${{ secrets.BUDGET_NOTIFICATION_EMAIL }}
      - name: Show the plan on the pull request
        # One comment, rewritten by each run, also by one that made no plan, so that an earlier
        # plan is not left standing. A plan too long for a comment is cut short and says so.
        if: ${{ !cancelled() }}
        run: |
          if [ -f plan.tfplan ]; then
            terraform show -no-color plan.tfplan > "$RUNNER_TEMP/plan.txt"
          else
            echo 'No plan was made. The log of this run says why.' > "$RUNNER_TEMP/plan.txt"
          fi
          # The AWS account's number stays out of the comment, as it stays out of the log.
          account="$(echo "$PLAN_ROLE" | cut -d: -f5)"
          [ -z "$account" ] || sed -i "s/$account/***/g" "$RUNNER_TEMP/plan.txt"
          {
            echo '### Terraform plan'
            echo
            echo '```'
            head -c 60000 "$RUNNER_TEMP/plan.txt"
            echo
            echo '```'
            if [ "$(wc -c < "$RUNNER_TEMP/plan.txt")" -gt 60000 ]; then
              echo
              echo 'Cut short to fit a comment. The whole plan is in the log of this run.'
            fi
          } > "$RUNNER_TEMP/plan.md"
          gh pr comment "$PULL_REQUEST" --edit-last --create-if-none \
            --body-file "$RUNNER_TEMP/plan.md"
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_ROLE: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
