name: Deploy

# What reaches main and passes verify goes live.
on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  deploy:
    # Only a push to main that passed, and only while it is still the newest commit there. A pull
    # request's run of verify never deploys, whatever its branch is called and wherever it comes
    # from. A commit that has been overtaken is left to the newer one's run, so that an older build
    # is never published over a newer one.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_sha == github.sha
    # One deploy at a time, and none is cancelled half way. Of those waiting, only the newest is
    # kept.
    concurrency:
      group: deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To ask GitHub for the token that AWS exchanges for the deploy role's credentials.
      id-token: write
    env:
      # The commit that passed, which is what the backend's image is named by.
      COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # Nothing after this reaches the repository through Git, so its token is not kept.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the frontend's packages
        working-directory: frontend
        run: npm ci
      - name: Build the frontend
        working-directory: frontend
        run: npm run build
        env:
          PRIMEUI_LICENSE_KEY: ${{ secrets.PRIMEUI_LICENSE_KEY }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          # A role that only a run on main can take on. Its ARN carries the AWS account's number,
          # so it is a secret, and the number is kept out of this run's log as well.
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - name: Build the backend's image
        # The host's processor is an ARM one. The image is built once for a commit, so a run that
        # is started again releases the image that is there.
        run: |
          registry="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          if aws ecr describe-images --repository-name "$REPOSITORY" --image-ids "imageTag=$COMMIT" \
            >/dev/null 2>&1; then
            echo "The image of $COMMIT is there already."
          else
            docker buildx build --platform linux/arm64 --provenance=false --push \
              --tag "$registry/$REPOSITORY:$COMMIT" backend
          fi
        env:
          REPOSITORY: vehicle-catalog-backend
      - name: Release the backend
        # The host fetches the image, starts it, and waits for it to say it is healthy. If it does
        # not, the host starts the image before it again and this step fails, so the frontend
        # built for the new backend is not published either.
        run: |
          command="$(aws ssm send-command --document-name vehicle-catalog-release \
            --targets Key=tag:Name,Values=vehicle-catalog --parameters "ImageTag=$COMMIT" \
            --query Command.CommandId --output text)"
          for _ in $(seq 1 180); do
            sleep 5
            status="$(aws ssm list-command-invocations --command-id "$command" \
              --query 'CommandInvocations[0].Status' --output text)"
            case "$status" in
              None | Pending | InProgress | Delayed) continue ;;
            esac
            aws ssm list-command-invocations --command-id "$command" --details \
              --query 'CommandInvocations[0].CommandPlugins[0].Output' --output text
            if [ "$status" = Success ]; then
              exit 0
            fi
            echo "The release ended as $status." >&2
            exit 1
          done
          echo "The host did not say how the release ended within fifteen minutes." >&2
          exit 1
      - name: Publish the frontend
        # The build's files go up and the ones it no longer has go away, then the page that names
        # them, then the distribution is told to fetch everything anew. A browser never keeps that
        # page without asking, so a visitor gets the new build on the next load.
        #
        # ponytail: the last build's files are removed at once, so a visitor who loaded the page
        # before a deploy can ask for a file that is gone until they reload. Keep the last build's
        # files for a while if that is ever seen.
        working-directory: frontend
        run: |
          named="Aliases.Items && contains(Aliases.Items, '$SITE')"
          distribution="$(aws cloudfront list-distributions --output text \
            --query "DistributionList.Items[?$named] | [0].Id")"
          if [ "$distribution" = None ]; then
            echo "No distribution answers to $SITE." >&2
            exit 1
          fi
          aws s3 sync dist/vehicle-catalog/browser "s3://$BUCKET" --delete --exclude index.html
          aws s3 cp dist/vehicle-catalog/browser/index.html "s3://$BUCKET/index.html" \
            --cache-control no-cache
          aws cloudfront create-invalidation --distribution-id "$distribution" --paths '/*'
        env:
          BUCKET: rgonz-vehicle-catalog-frontend
          SITE: catalog.rgonz.dev
